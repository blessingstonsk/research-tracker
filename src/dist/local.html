<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>PhD Research Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Daily log, research plan, literature, experiments, writing, meetings and reports for a PhD on explainable vision-language models for autonomous driving.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: portfolio template — sticky blurred top nav, hero with 3D stage, rounded cards that tilt; dark-first navy with a signal-blue accent */
:root {
  --bg: #0a1020; --surface: #101a2e; --surface-2: #16233b; --surface-3: #1e2d49; --line: #24365a; --line-2: #2f4570;
  --ink: #e9f0fb; --ink-2: #b9c7de; --muted: #8597b4;

  --s-research: #3d8bff; --s-teaching: #e8774a; --s-admin: #22b07d; --s-other: #6c7c96;
  --heat-0: #17233a; --heat-1: #173f78; --heat-2: #1f5fb0; --heat-3: #3d8bff; --heat-4: #9fd0ff;
  --ok: #4fd18b; --ok-bg: rgba(79,209,139,.13); --warn: #f5c04d; --warn-bg: rgba(245,192,77,.13); --bad: #ff7a6b; --bad-bg: rgba(255,122,107,.13); --info: #8cc6ff; --info-bg: rgba(78,168,255,.14); --plain-bg: #1b2943;
  --scene-bg: #0b1426; --scene-road: #18253d; --scene-ground: #0d1729; --scene-mark: #5a7bb0; --scene-build: #13213a; --scene-edge: #29456f;
  --shadow: 0 24px 60px -28px rgba(0,0,0,.8);
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 22px; --r-sm: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef3fa; --surface: #ffffff; --surface-2: #e6edf8; --surface-3: #d9e3f2; --line: #d0dbec; --line-2: #b9c8e0;
  --ink: #0e1b33; --ink-2: #33476a; --muted: #5d6f8f;
  --accent: #1667d9; --accent-2: #0f4fab; --accent-ink: #ffffff; --accent-soft: rgba(22,103,217,.11); --glow: 0 0 0 1px rgba(22,103,217,.3), 0 18px 44px -24px rgba(22,103,217,.45);
  --s-research: #2a78d6; --s-teaching: #e0632f; --s-admin: #14996a; --s-other: #8a98ad;
  --heat-0: #e3eaf5; --heat-1: #b7d3f6; --heat-2: #6da7ec; --heat-3: #2a78d6; --heat-4: #184f95;
  --ok: #0a7d3c; --ok-bg: #dff3e7; --warn: #8a5a00; --warn-bg: #fdf1d6; --bad: #b42d2d; --bad-bg: #fbe5e5; --info: #1453ad; --info-bg: #e1ecfb; --plain-bg: #e8eef7;
  --scene-bg: #dfe8f5; --scene-road: #c3d0e3; --scene-ground: #d3deee; --scene-mark: #f5f8fd; --scene-build: #c8d5e9; --scene-edge: #9fb3d3;
  --shadow: 0 22px 50px -30px rgba(14,40,90,.35);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef3fa; --surface: #ffffff; --surface-2: #e6edf8; --surface-3: #d9e3f2; --line: #d0dbec; --line-2: #b9c8e0;
  --ink: #0e1b33; --ink-2: #33476a; --muted: #5d6f8f;
  --accent: #1667d9; --accent-2: #0f4fab; --accent-ink: #ffffff; --accent-soft: rgba(22,103,217,.11); --glow: 0 0 0 1px rgba(22,103,217,.3), 0 18px 44px -24px rgba(22,103,217,.45);
  --s-research: #2a78d6; --s-teaching: #e0632f; --s-admin: #14996a; --s-other: #8a98ad;
  --heat-0: #e3eaf5; --heat-1: #b7d3f6; --heat-2: #6da7ec; --heat-3: #2a78d6; --heat-4: #184f95;
  --ok: #0a7d3c; --ok-bg: #dff3e7; --warn: #8a5a00; --warn-bg: #fdf1d6; --bad: #b42d2d; --bad-bg: #fbe5e5; --info: #1453ad; --info-bg: #e1ecfb; --plain-bg: #e8eef7;
  --scene-bg: #dfe8f5; --scene-road: #c3d0e3; --scene-ground: #d3deee; --scene-mark: #f5f8fd; --scene-build: #c8d5e9; --scene-edge: #9fb3d3;
  --shadow: 0 22px 50px -30px rgba(14,40,90,.35);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { scroll-behavior: smooth; overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  background-image: radial-gradient(1200px 500px at 85% -10%, var(--accent-soft), transparent 60%), radial-gradient(900px 400px at -10% 10%, rgba(61,139,255,.06), transparent 60%); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.8rem, 3.2vw, 2.6rem); line-height: 1.12; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
.hl { color: var(--accent); }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font: 600 11.5px var(--f-display); text-transform: uppercase; letter-spacing: .16em; color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* top navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav-inner { display: flex; align-items: center; gap: 16px; height: 66px; max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.mono-badge { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 800 13px var(--f-display); box-shadow: 0 6px 20px -6px var(--accent); }
.brand b { font: 700 1rem var(--f-display); white-space: nowrap; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.nav-links { display: flex; gap: 2px; margin: 0 0 0 auto; padding: 0; list-style: none; }
.nav-links a { position: relative; display: block; padding: 8px 11px; text-decoration: none; font: 500 .88rem var(--f-display); color: var(--muted); transition: color .2s; white-space: nowrap; }
.nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--ink); }
.nav-links a[aria-current="page"]::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 0; height: 2px; border-radius: 2px; background: var(--accent); }
.nav-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.more-wrap { position: relative; }
.more-menu { position: absolute; right: 0; top: calc(100% + 10px); width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 8px; display: grid; gap: 2px; z-index: 60; }
.more-menu a, .more-menu button { display: block; text-align: left; padding: 8px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font: 500 13.5px var(--f-body); background: none; border: 0; cursor: pointer; width: 100%; }
.more-menu a:hover, .more-menu button:hover { background: var(--surface-2); color: var(--ink); }
.more-menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.store-line { font-size: 11.5px; color: var(--muted); padding: 6px 10px 2px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.err { background: var(--bad); }
.burger { display: none; }
.drawer-nav { position: fixed; inset: 0 0 0 auto; width: min(300px, 86vw); background: var(--surface); z-index: 66; transform: translateX(102%); transition: transform .22s ease; border-left: 1px solid var(--line); padding: calc(16px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 16px 14px; display: grid; align-content: start; gap: 2px; overflow-y: auto; }
.drawer-nav:not(.open) { display: none; }
.drawer-nav.open { transform: none; }
.drawer-nav a { padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink-2); font: 500 15px var(--f-display); }
.drawer-nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.drawer-nav .eyebrow { padding: 14px 12px 4px; }
.scrim { display: none; }
.scrim.open { display: block; position: fixed; inset: 0; background: rgba(2,6,15,.55); z-index: 65; }
@media (max-width: 1180px) { .nav-links { display: none; } .burger { display: grid; } .nav-actions { margin-left: auto; } }
@media (max-width: 480px) { .brand b { font-size: .9rem; } .nav-actions .icon-btn { width: 34px; height: 34px; } }
@media (max-width: 380px) { .brand > span:last-child { display: none; } }
@media (max-width: 560px) { .brand small { display: none; } .nav-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; } .log-label { display: none; } }

.main { min-width: 0; }
.content { padding-block: 26px 70px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; width: 100%; display: grid; gap: 20px; align-content: start; }
@media (max-width: 560px) { .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* hero (dashboard) */
.hero { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.25fr); gap: 28px; align-items: center; }
@media (max-width: 980px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero .role { font: 500 1rem var(--f-display); color: var(--ink); margin-top: 10px; }
.hero .role .sep { color: var(--accent); margin: 0 6px; font-weight: 700; }
.hero .callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 16px 0; font: 600 1.05rem/1.35 var(--f-display); }
.hero .callout small { display: block; font: 500 12px var(--f-body); color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .1em; }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.hero-stat { padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); min-width: 104px; }
.hero-stat b { display: block; font: 600 1.35rem var(--f-mono); }
.hero-stat span { font-size: 11.5px; color: var(--muted); }
.stage3d { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--scene-bg); aspect-ratio: 16 / 10; min-height: 260px; box-shadow: var(--shadow); touch-action: none; }
@media (max-width: 600px) { .stage3d { aspect-ratio: 4 / 3.4; min-height: 0; } .stage-top .legend, .stage-hint { display: none; } }
.stage3d canvas { display: block; width: 100% !important; height: 100% !important; cursor: grab; }
.stage3d canvas:active { cursor: grabbing; }
.stage-top { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
.stage-top > * { pointer-events: auto; }
.stage-title { background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 12px; }
.stage-title b { font: 600 13px var(--f-display); display: block; }
.stage-ctrl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
.stage-ctrl button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--ink); font: 600 16px var(--f-mono); cursor: pointer; }
.stage-ctrl button:hover { border-color: var(--accent); color: var(--accent); }
.stage-hint { position: absolute; left: 14px; bottom: 14px; font: 500 11px var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 3px 8px; border-radius: 999px; }
.lbl-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl3d { position: absolute; transform: translate(-50%, -100%); font: 500 10.5px var(--f-mono); padding: 2px 7px; border-radius: 6px; white-space: nowrap; background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--ink); border: 1px solid var(--line); }
.lbl3d.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.stage-2d { padding: 54px 16px 16px; background: var(--surface); }

/* 3D tilt */
[data-tilt] { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0); transition: transform .45s cubic-bezier(.2,.7,.2,1), border-color .2s, box-shadow .3s; will-change: transform; }
[data-tilt].tilting { transition-duration: .12s, .2s, .3s; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: var(--glow); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 8px 16px; border-radius: 999px; font: 600 13px/1.2 var(--f-display); transition: transform .15s, background .2s, border-color .2s, box-shadow .2s; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary { box-shadow: 0 8px 24px -10px var(--accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.icon { padding: 6px; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 11px; min-width: 0; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; min-width: 0; }
label.f.req > span::after { content: " *"; color: var(--bad); }
.hint { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.filters > * { width: auto; }
.filters input[type="search"] { min-width: 200px; flex: 1; }
.filters select, .filters input[type="date"] { max-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font: 500 13px var(--f-body); color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }

/* cards & grids */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; transition: border-color .2s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .g2, .g3, .g-side { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; display: grid; gap: 3px; align-content: start; position: relative; overflow: hidden; }
.kpi::after { content: ""; position: absolute; inset: auto -30% -60% auto; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft), transparent 70%); pointer-events: none; }
.kpi .v { font: 600 1.7rem/1.15 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .v small { font-size: .8rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
.kpi .l { font: 500 12px var(--f-display); color: var(--ink-2); }
.kpi .s { font-size: 11.5px; color: var(--muted); }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head p { margin: 8px 0 0; color: var(--ink-2); max-width: 70ch; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--plain-bg); color: var(--ink-2); line-height: 1.6; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.pill.nodot::before { display: none; }
.pill.done, .pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.progress, .pill.info { background: var(--info-bg); color: var(--info); }
.pill.blocked, .pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.planned { background: var(--plain-bg); color: var(--ink-2); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 11.5px; color: var(--ink-2); background: var(--surface); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip[class*="k-"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.chip.k-research::before { background: var(--s-research); } .chip.k-teaching::before { background: var(--s-teaching); } .chip.k-admin::before { background: var(--s-admin); } .chip.k-other::before { background: var(--s-other); }
a.chip { text-decoration: none; cursor: pointer; } a.chip:hover { border-color: var(--accent); color: var(--accent); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.mono { white-space: nowrap; }
.fgrid { align-items: start; }

function parseDateValue(v) {

  if (typeof v === 'number' && isFinite(v)) {
    if (v > 20000 && v < 80000) return { value: excelSerialToISO(v) };

/* ---------- defaults ---------- */
const DEFAULT_FOCUS = [
  { name: 'O1 – VLM Adaptation (Edge Cases)', kind: 'research', objectiveId: 'obj-O1' },

  { id: 'obj-O2', code: 'O2', title: 'Develop cross-modal explanations connecting predictions to visual regions and language concepts.', description: '', contribution: '', successCriteria: '', evidence: '', focus: 'O2 – Cross-Modal Explainability' },

/* ---------- helpers over state ---------- */
function live(arr) { return (arr || []).filter(r => !r.deleted); }

  const e = find('experiments', L.experimentId); if (e && e.objectiveId) return e.objectiveId;

    (!f.focus || l.focus === f.focus) &&

/** Core effort summary. Total hours = sum of logged session hours; each working date counted once;

/* ---------- report generation (every line carries refs to saved records) ---------- */
function generateReport(state, opt) {

  const L = (r) => ref('logs', r, 'Log ' + fmtDate(r.date));

  const sec = (key, heading) => { const s = { key, heading, items: [], missing: [] }; sections.push(s); return s; };

  const e = sec('effort', 'Effort summary');

    if (sum.prodN) e.items.push({ text: 'Average self-reported productivity: ' + sum.prodAvg + ' / 5 (' + sum.prodN + ' rated sessions).', refs: [] });

  const w = sec('work', 'Work completed and tangible outputs');

  live(state.tasks).filter(t => isDone(t.status) && inRange(t.completedDate, from, to)).forEach(t => w.items.push({ text: 'Task completed: ' + t.title + ' (' + fmtDate(t.completedDate) + ')', refs: [ref('tasks', t, 'Task')] }));
  live(state.milestones).filter(m => isDone(m.status) && inRange(m.completedDate, from, to)).forEach(m => w.items.push({ text: 'Milestone reached: ' + m.title + ' (' + fmtDate(m.completedDate) + ')', refs: [ref('milestones', m, 'Milestone')] }));

  const noOut = logs.filter(l => !l.output).length; if (noOut) w.missing.push(noOut + ' session(s) have no output/deliverable recorded.');

  const o = sec('objectives', 'Progress by research objective');

    const p = objectiveProgress(state, ob.id);

  return '<div style="display:grid;gap:8px">' + rows.map(r => '<div data-tip="' + esc(r.label + ': ' + fmtH(r.value) + ' ' + unit + (r.sub ? '\n' + r.sub : '')) + '" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.label) + '</span><span class="num small">' + fmtH(r.value) + ' ' + unit + (r.sub ? ' <span class="muted">' + esc(r.sub) + '</span>' : '') + '</span><div class="bar" style="grid-column:1/-1;height:7px"><i style="width:' + Math.max(2, 100 * r.value / max) + '%;background:var(--s-' + (r.kind || 'research') + ')"></i></div></div>').join('') + '</div>';
}

/** calendar heatmap, weeks ending at endISO */
function heatmap(daily, endISO, weeks) {
  const cell = 12, gap = 3, L = 28, T = 16; const start = C.addDays(C.weekStart(endISO), -7 * (weeks - 1));
  const W = L + weeks * (cell + gap), H = T + 7 * (cell + gap) + 4;
  const vals = Object.values(daily).map(d => d.hours).filter(v => v > 0); const mx = Math.max(...vals, 1);
  const lvl = h => h <= 0 ? 0 : h < mx * .25 ? 1 : h < mx * .5 ? 2 : h < mx * .8 ? 3 : 4;
  let out = ''; let lastM = ''; let lastX = -99;
  for (let w = 0; w < weeks; w++) {
    const ws = C.addDays(start, 7 * w); const m = ws.slice(0, 7);
    if (m !== lastM) { const x = L + w * (cell + gap); if (x - lastX > 30) { out += '<text x="' + x + '" y="10">' + C.MONTHS[Number(ws.slice(5, 7)) - 1] + '</text>'; lastX = x; } lastM = m; }
    for (let d = 0; d < 7; d++) {
      const day = C.addDays(ws, d); if (day > endISO) continue;
      const v = daily[day]; const h = v ? v.hours : 0;
      const tip = C.dayName(day) + ' ' + C.fmtDate(day) + '\n' + (v ? fmtH(v.hours) + ' h · ' + v.sessions + ' session(s)' : 'No sessions');
      out += '<rect x="' + (L + w * (cell + gap)) + '" y="' + (T + d * (cell + gap)) + '" width="' + cell + '" height="' + cell + '" rx="2.5" fill="var(--heat-' + (v && !h ? 1 : lvl(h)) + ')" data-tip="' + esc(tip) + '"/>';
    }
  }
  ['Mon', '', 'Wed', '', 'Fri', '', ''].forEach((t, i) => { if (t) out += '<text x="0" y="' + (T + i * (cell + gap) + 10) + '">' + t + '</text>'; });
  return '<div class="heat-wrap"><svg class="chart" style="min-width:' + W + 'px;max-width:' + (W * 1.25) + 'px" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Daily hours heatmap">' + out + '</svg></div>' +
    '<div class="legend" style="margin-top:6px;align-items:center"><span class="muted small">Less</span>' + [0, 1, 2, 3, 4].map(i => '<i style="background:var(--heat-' + i + ');margin:0"></i>').join('') + '<span class="muted small">More (max ' + fmtH(mx) + ' h/day)</span></div>';
}

  const KINDS = ['research', 'teaching', 'admin', 'other'];
  function build(ws) {
    weeks = ws; clearWorld(); built = true;

    const scale = 6.5 / Math.max(max, 4); // tallest tower ≈ 9 units, small weeks stay readable

        const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .18 })); e.position.copy(m.position); g.add(e); });

  const ray = () => new THREE.Raycaster();
  function pick(e) {
    const r = R.domElement.getBoundingClientRect(); const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);

function readField(form, f, name) {

function objChip(s, id) { if (!id) return ''; const o = Store.get('objectives', id); return o ? ' <span class="chip">' + esc(o.code) + '</span>' : ''; }
function writingDeadlines(s, today) {
  const out = []; const horizon = C.addDays(today, 60);
  C.live(s.manuscripts).forEach(m => {
    if (m.deadline && !['Accepted', 'Published', 'Rejected'].includes(m.stage) && m.deadline <= horizon && m.deadline >= C.addDays(today, -30)) out.push({ m, date: m.deadline, label: 'Writing: ' + m.title });
    (m.submissions || []).forEach(sb => { if (sb.revisionDeadline && sb.revisionDeadline <= horizon && sb.revisionDeadline >= C.addDays(today, -30)) out.push({ m, date: sb.revisionDeadline, label: 'Revision due: ' + m.title }); });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function calendarHTML(s, tasks, today) {
  const month = U.plan.month || today.slice(0, 7); const first = month + '-01'; const gridStart = C.weekStart(first); const last = C.monthEnd(first);
  const evs = {}; tasks.forEach(t => { if (t.dueDate) (evs[t.dueDate] = evs[t.dueDate] || []).push({ k: 'task', r: t }); });
  C.live(s.milestones).forEach(m => { if (m.targetDate && (!U.plan.obj || m.objectiveId === U.plan.obj)) (evs[m.targetDate] = evs[m.targetDate] || []).push({ k: 'ms', r: m }); });
  C.live(s.manuscripts).forEach(m => { if (m.deadline) (evs[m.deadline] = evs[m.deadline] || []).push({ k: 'ms', r: m, col: 'manuscripts', label: 'Deadline: ' + m.title }); });
  let cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => '<div class="dh">' + d + '</div>').join('');
  for (let d = gridStart; d <= last || C.diffDays(gridStart, d) % 7 !== 0; d = C.addDays(d, 1)) {
    const e = evs[d] || [];
    cells += '<div class="dc' + (d.slice(0, 7) !== month ? ' out' : '') + (d === today ? ' today' : '') + '"><span class="dn">' + Number(d.slice(8)) + '</span>' + e.map(x => { const col = x.col || (x.k === 'task' ? 'tasks' : 'milestones'); const done = C.isDone(x.r.status);

}

/* ---------- backups ---------- */
async function autoBackup(label) {
  if (Store.mode === 'gas') return false; // a backup would not fit in one sheet cell; Google Sheets keeps version history
  const json = JSON.stringify(Store.exportAll(false));
  if (json.length > 240000) return false;
  const rec = { label, createdAt: C.nowStamp(), size: json.length, json };
  await Store.put('backups', rec, { silent: true });
  const all = Array.from(Store.maps.backups.values()).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  for (const old of all.slice(8)) Store.hardDelete('backups', old.id);
  return true;
}

}
async function doRestore(mode, payload) {
  const d = payload || (RESTORE && RESTORE.d); if (!d) return;
  await autoBackup('Before restore (' + mode + ')');
  for (const col of COLS) { if (col === 'backups') continue; const incoming = d.data[col] || [];
    if (mode === 'replace') { const keep = new Set(incoming.map(r => r.id)); for (const id of Array.from(Store.maps[col].keys())) if (!keep.has(id)) Store.hardDelete(col, id); await Store.putMany(col, incoming.map(r => Object.assign({}, r))); }
    else { const add = incoming.filter(r => { const cur = Store.get(col, r.id); return !cur || (r.updatedAt || '') > (cur.updatedAt || ''); }); if (add.length) await Store.putMany(col, add.map(r => Object.assign({}, r))); } }
  RESTORE = null; toast('Restore complete (' + mode + ')'); render();
}

function calcHelp() {
  return '<section class="card prose"><h2>How progress is calculated</h2>' +
    '<h3>Effort (hours)</h3><p>Total hours = the sum of the Hours field over logged sessions in the period. Sessions without hours are listed as missing and are not treated as zero. <b>Days worked</b> counts each date with at least one session once, however many sessions it has. <b>Average hours per working day</b> = total hours ÷ days worked, both from the same period. Planned effort on tasks is kept separate from actual effort, which is the sum of hours of log sessions linked to the task.</p>' +
    '<h3>Research versus other work</h3><p>Each focus area has a kind (Research, Teaching, Administration, Other) set under Categories. Hours are split by that kind everywhere, so teaching and admin never inflate research effort.</p>' +
    '<h3>Objective progress</h3><p>Progress = completed milestones ÷ milestones defined for that objective. It is shown as <i>unavailable</i> until at least one milestone is confirmed. Suggested milestones do not count until you save them. Hours logged are reported beside progress as a separate measure of effort, together with the number of logged deliverables.</p>' +
    '<h3>Tasks</h3><p>Task counts come from the task list, so a task discussed across several sessions counts once. Log sessions keep their own Status field, which is reported separately and never counted as task completion. A task is completed when its status is Done; its completion date is recorded then.</p>' +
    '<h3>Papers</h3><p>A paper counts as fully read only when its reading status is Read. The daily log’s Papers Read number is a separate legacy count and is never added to the library count.</p>' +
    '<h3>Experiments</h3><p>Runs are compared only when dataset, dataset version, split and evaluation setting match. Missing details are flagged. Failed and abandoned runs remain visible.</p>' +
    '<h3>Productivity</h3><p>The 1–5 rating is self-reported and only averaged over sessions that have a rating.</p>' +
    '<h3>Dates</h3><p>All dates use the Asia/Kolkata time zone and are shown as “23 Oct 2026”. Weeks start on Monday.</p></section>';
}

  }
});
function closeRail() { const m = document.getElementById('more-menu'); if (m) { m.hidden = true; document.getElementById('more-btn').setAttribute('aria-expanded', 'false'); } document.getElementById('drawer-nav').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }

document.addEventListener('submit', e => {
  if (e.target.id === 'drawer-form') { e.preventDefault(); saveDrawer(); }
  else if (e.target.id === 'quick-form') { e.preventDefault(); submitQuick(e.target); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'wb-file' && t.files[0]) { handleWorkbookFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'restore-file' && t.files[0]) { handleRestoreFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'gs-auto') { GSync.saveCfg({ auto: t.checked }); toast(t.checked ? 'Automatic sync on' : 'Automatic sync off'); return; }
  if (t.dataset.fa != null) { const st = JSON.parse(JSON.stringify(Store.state().settings)); const f = st.focusAreas[Number(t.dataset.fa)]; const old = f.name; f[t.dataset.k] = t.value.trim();
    if (t.dataset.k === 'name' && old !== f.name && f.name) { // keep records connected when a focus area is renamed
      C.live(Store.state().logs).filter(l => l.focus === old).forEach(l => { const L = Store.get('logs', l.id); L.focus = f.name; Store.put('logs', L, { silent: true }); });
      C.live(Store.state().tasks).filter(x => x.focus === old).forEach(x => { const T = Store.get('tasks', x.id); T.focus = f.name; Store.put('tasks', T, { silent: true }); });
      C.live(Store.state().objectives).filter(x => x.focus === old).forEach(x => { const O = Store.get('objectives', x.id); O.focus = f.name; Store.put('objectives', O, { silent: true }); }); }
    Store.put('settings', st); toast('Saved'); return; }
  const ch = t.dataset.change; if (!ch) return;
  if (ch === 'qdraft') { QDRAFT[t.name] = t.value; saveDraft(); if (t.name === 'date') { const d = document.getElementById('q-day'); if (d) d.textContent = C.dayName(t.value) + ' ' + C.fmtDate(t.value); } return; }
  if (ch.startsWith('task-status:')) { const T = Store.get('tasks', ch.split(':')[1]); if (T) { const prev = JSON.parse(JSON.stringify(T)); T.status = t.value; normalizeRecord('tasks', T, prev); Store.put('tasks', T); toast('Status → ' + t.value); } return; }
  if (ch.startsWith('apply-filter:')) { const sc = ch.split(':')[1]; const f = (Store.state().settings.savedFilters || []).find(x => x.id === t.value); if (f) { if (sc === 'dashboard') Object.assign(U.dash, f.filter); else Object.assign(U.log, f.filter); render(); } return; }
  const [area, key] = ch.split(':');
  const map = { dash: U.dash, log: U.log, plan: U.plan, lit: U.lit, exp: U.exp, rep: U.rep };
  if (map[area]) { map[area][key] = t.value; if (area === 'rep') U.rep.draft = null; render(); }
});
let INPUT_T = null;
document.addEventListener('input', e => {
  const t = e.target; const k = t.dataset.input; if (!k) return;
  if (k === 'qdraft') { QDRAFT[t.name] = t.value; saveDraft(); if (t.name === 'date') { const d = document.getElementById('q-day'); if (d) d.textContent = C.dayName(t.value) + ' ' + C.fmtDate(t.value); } return; }
  if (k.startsWith('rep-text:')) { U.rep.draft.dirty = true; U.rep.draft.sections[Number(k.split(':')[1])].text = t.value; return; }
  if (k === 'rep-title') { U.rep.draft.dirty = true; U.rep.draft.title = t.value; return; }
  const [area, key] = k.split(':'); const map = { log: U.log, plan: U.plan, lit: U.lit, exp: U.exp };
  if (map[area]) { map[area][key] = t.value; clearTimeout(INPUT_T); INPUT_T = setTimeout(render, 220); }
});
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.toggle === 'qmore') { QDRAFT.open = e.target.open; saveDraft(); } }, true);
document.addEventListener('focusout', e => { if (PENDING_WHILE_TYPING) setTimeout(() => { if (!isTyping() && PENDING_WHILE_TYPING) { PENDING_WHILE_TYPING = false; render(); } }, 50); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.getElementById('modal-host').innerHTML) closeModal(); else if (DR) closeDrawer(); else closeRail(); } });
/* drag & drop for kanban */
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (col) { e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('dragleave', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); const T = Store.get('tasks', id); if (T && T.status !== col.dataset.drop) { const prev = JSON.parse(JSON.stringify(T)); T.status = col.dataset.drop; normalizeRecord('tasks', T, prev); Store.put('tasks', T); toast('Moved to ' + T.status); } });
/* tooltips */
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); const tip = document.getElementById('tip'); if (!tip) return; if (el) { tip.textContent = el.dataset.tip; tip.hidden = false; } else tip.hidden = true; });
document.addEventListener('mousemove', e => { const tip = document.getElementById('tip'); if (tip && !tip.hidden) { const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); const y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8); tip.style.left = x + 'px'; tip.style.top = y + 'px'; } });
/* 3D tilt on cards */
let TILT_EL = null; const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointermove', e => {
  if (REDUCE || e.pointerType === 'touch') return;
  const el = e.target.closest && e.target.closest('[data-tilt]');
  if (TILT_EL && TILT_EL !== el) { TILT_EL.style.removeProperty('--rx'); TILT_EL.style.removeProperty('--ry'); TILT_EL.classList.remove('tilting'); TILT_EL = null; }
  if (!el) return; TILT_EL = el; el.classList.add('tilting');
  const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
  const k = Math.min(1, 260 / Math.max(r.width, 1)) * 9;
  el.style.setProperty('--rx', (-py * k).toFixed(2) + 'deg'); el.style.setProperty('--ry', (px * k).toFixed(2) + 'deg');
});
document.addEventListener('pointerleave', () => { if (TILT_EL) { TILT_EL.style.removeProperty('--rx'); TILT_EL.style.removeProperty('--ry'); TILT_EL.classList.remove('tilting'); TILT_EL = null; } });
function afterRender(v) {
  if (v === 'dashboard') { const host = document.getElementById('stage3d'); if (host && window.LAST_WEEKS) { const ok = U.dash.view2d ? false : City3D.mount(host, window.LAST_WEEKS); if (!ok) City3D.fallback(host, window.LAST_WEEKS); } }
  else City3D.pause();
}
window.addEventListener('hashchange', () => { closeRail(); render(); const v = document.getElementById('view'); if (v) { v.focus({ preventScroll: true }); window.scrollTo(0, 0); } });

(async function boot() {
  let t = ''; try { t = localStorage.getItem('rt-theme') || ''; } catch (e) {}
  shell(); applyTheme(t);
  Store.on(scheduleRender); Store.on(() => GSync.onChange());
  await Store.init();
  render();
  GSync.onChange(); // catch up on edits made since the last sync
})();
// web app: pick up edits made on another device when this page comes back into view
let HIDDEN_AT = 0;
document.addEventListener('visibilitychange', () => {
  if (Store.mode !== 'gas') return;
  if (document.hidden) { HIDDEN_AT = Date.now(); return; }
  if (HIDDEN_AT && Date.now() - HIDDEN_AT > 30000 && !DR) Store.reload().then(ok => { if (ok) Store.emit(); });
});

</script>
